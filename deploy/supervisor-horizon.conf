; Keep Horizon running after reboot / crash.
; Prefer: bash deploy/install-app.sh  (rewrites path from APP_DIR)
; Manual:
;   1. Confirm path is /var/www/cellogent/cellogent-be (or replace below).
;   2. sudo cp deploy/supervisor-horizon.conf /etc/supervisor/conf.d/cellogent-horizon.conf
;   3. sudo supervisorctl reread && sudo supervisorctl update
;   4. sudo supervisorctl start cellogent-horizon:*
;
; After each git deploy: php artisan horizon:terminate  (deploy.sh does this)

[program:cellogent-horizon]
process_name=%(program_name)s
command=php /var/www/cellogent/cellogent-be/artisan horizon
directory=/var/www/cellogent/cellogent-be
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/cellogent/cellogent-be/storage/logs/horizon.log
stopwaitsecs=3600
numprocs=1
