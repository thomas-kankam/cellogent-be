; Keep Horizon running after reboot / crash.
; 1. Edit command= and stdout_logfile= to this project's real path.
; 2. sudo cp deploy/supervisor-horizon.conf /etc/supervisor/conf.d/cellogent-horizon.conf
; 3. sudo supervisorctl reread && sudo supervisorctl update
; 4. sudo supervisorctl start cellogent-horizon:*

[program:cellogent-horizon]
process_name=%(program_name)s
command=php /var/www/html/naasei/projects/cellogent-be/artisan horizon
directory=/var/www/html/naasei/projects/cellogent-be
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/naasei/projects/cellogent-be/storage/logs/horizon.log
stopwaitsecs=3600
numprocs=1
