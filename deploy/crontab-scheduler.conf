# Laravel scheduler — must run every minute.
# Drives: SMS DLR, stuck SMS re-dispatch, payment verify, aggregator balance,
# engagement blasts, birthday occasions, reward disbursements.
#
# Prefer: bash deploy/install-app.sh  (rewrites path from APP_DIR)
# Manual:
#   1. Confirm path is /var/www/cellogent/backend (or replace below).
#   2. sudo cp deploy/crontab-scheduler.conf /etc/cron.d/cellogent-scheduler
#   3. sudo chmod 644 /etc/cron.d/cellogent-scheduler
#
# Alternative (user crontab): sudo crontab -u www-data -e
#   * * * * * cd /var/www/cellogent/backend && php artisan schedule:run >> /dev/null 2>&1

SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

* * * * * www-data cd /var/www/cellogent/backend && php artisan schedule:run >> /dev/null 2>&1
