# Laravel scheduler — must run every minute.
# Delivery polling, re-queuing stuck SMS, aggregator balance checks, and payment verification all depend on it.
#
# Install (Ubuntu):
#   1. Edit the path below to this project's real path (same as Horizon).
#   2. sudo cp deploy/crontab-scheduler.conf /etc/cron.d/cellogent-scheduler
#   3. sudo chmod 644 /etc/cron.d/cellogent-scheduler
#   4. Confirm: sudo grep cellogent /etc/cron.d/cellogent-scheduler
#   5. Watch a run: sudo -u www-data php /var/www/html/naasei/projects/cellogent-be/artisan schedule:list
#
# Alternative (user crontab): sudo crontab -u www-data -e
#   * * * * * cd /var/www/html/naasei/projects/cellogent-be && php artisan schedule:run >> /dev/null 2>&1

SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

* * * * * www-data cd /var/www/html/naasei/projects/cellogent-be && php artisan schedule:run >> /dev/null 2>&1
